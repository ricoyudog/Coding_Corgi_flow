name: CorgiSpec CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/corgispec

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/corgispec/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/corgispec/package-lock.json
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run coverage
      - run: npm run validate:skills
      - run: npm run check:skill-mirrors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corgispec-coverage
          path: packages/corgispec/coverage
          if-no-files-found: ignore

  platform-path-and-lock:
    name: Path and lock smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/corgispec/package-lock.json
      - run: npm ci
      - run: npm test -- test/config.test.ts test/install-assets.test.ts test/planning-revision.test.ts test/artifact-resolver.test.ts test/instructions.test.ts test/changes.test.ts

  openspec-1-6-e2e:
    name: OpenSpec 1.6 and package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/corgispec/package-lock.json
      - run: npm install --global @fission-ai/openspec@1.6.0
      - run: openspec --version
      - run: npm ci
      - run: npm test
        env:
          CORGISPEC_E2E_OPENSPEC: "1"
      - run: npm run pack:smoke
